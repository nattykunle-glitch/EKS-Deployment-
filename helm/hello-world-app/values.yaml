replicaCount: 3   # temporarily reduced from 4 — Cluster Autoscaler IRSA fix not yet applied (see README §11)

image:
  repository: ""   # set by CI/CD: <account-id>.dkr.ecr.<region>.amazonaws.com/hello-world-eks-app
  tag: "latest"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3     # temporarily reduced from 4 — matches replicaCount above
  maxReplicas: 12    # ceiling stays the same; HPA will simply queue extra pods as Pending if nodes are unavailable, which doesn't block deploys the way Helm's --wait does
  targetCPUUtilizationPercentage: 50
  targetMemoryUtilizationPercentage: 50
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
  host: ""   # optional custom domain; leave blank to use the ALB's generated DNS name
