# CI for the gitops branch: build the Docker image and push to ECR.
# Argo CD (running in-cluster) handles CD by watching the Helm chart / image tag —
# this workflow does NOT touch the cluster directly, which is the core GitOps principle:
# the cluster pulls changes, nothing pushes into it from outside.

name: Build and Push to ECR

on:
  push:
    branches: [ gitops ]
    paths:
      - 'app/**'

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: hello-world-eks-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # for OIDC auth to AWS, no long-lived keys needed
      contents: write    # to commit the updated image tag back to the repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./app
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Update Helm values with new image tag
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s|repository:.*|repository: $ECR_REGISTRY/$ECR_REPOSITORY|" helm/hello-world-app/values.yaml
          sed -i "s|tag:.*|tag: \"$IMAGE_TAG\"|" helm/hello-world-app/values.yaml

      - name: Commit updated values.yaml
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add helm/hello-world-app/values.yaml
          git commit -m "ci: bump image tag to ${{ github.sha }}" || echo "No changes to commit"
          git push
